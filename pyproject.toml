[project]
name = "search-r1-reproduce"
version = "0.1.0"
description = "Search-R1 training and evaluation with BM25 retrieval and the Tinker SDK"
requires-python = ">=3.12,<3.13"
license-files = ["third_party/tinker_cookbook/LICENSE", "third_party/tinker_cookbook/UPSTREAM.md"]
dependencies = [
    "aiohttp",
    "chz",
    "huggingface-hub",
    "numpy",
    "pandas",
    "pyarrow",
    "pydantic>=2",
    "pydantic-core",
    "python-dotenv",
    "tinker",
    "tokenizers",
    "torch",
    "transformers",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = ["httpx", "pytest", "ruff"]

[tool.uv]
# Use the interpreter selected by pyenv local (see .python-version) and disable uv downloads.
python-preference = "only-system"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["search_r1"]

# Match tinker-cookbook's style to avoid formatting-only diffs in copied files.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = [
    "E501", "B028", "SIM108", "UP007", "RUF001", "RUF002", "RUF003", "RUF005", "RUF006",
    "RUF012", "RUF046", "B008", "B905", "B023", "B027", "RUF059", "SIM117", "RUF022",
]

[tool.ruff.lint.isort]
known-first-party = ["search_r1"]
