[project]
name = "search-r1-reproduce"
version = "0.1.0"
description = "Small-scale Search-R1 reproduction on tinker-cookbook's search_tool recipe"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tinker-cookbook",
    "pandas",
    "pyarrow",
    "python-dotenv",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
# Use the interpreter selected by pyenv local (see .python-version) and disable uv downloads.
python-preference = "only-system"

[tool.uv.sources]
# Pin the commit used to review the reproduction plan on 2026-11-14. Review changes before upgrading.
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook", rev = "1991897cba59ea9d9b0030d183d1867b28eba9d9" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["search_r1"]

# Match tinker-cookbook's style to avoid formatting-only diffs in copied files.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]
ignore = [
    "E501", "B028", "SIM108", "UP007", "RUF001", "RUF002", "RUF003", "RUF005", "RUF006",
    "RUF012", "RUF046", "B008", "B905", "B023", "B027", "RUF059", "SIM117", "RUF022",
]

[tool.ruff.lint.isort]
known-first-party = ["search_r1"]
